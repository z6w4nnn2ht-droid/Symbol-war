<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>符号大战</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@700&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#1ea761;--ink:#16301f;--muted:#4c6b58;--key:#f4fbf6;--line:#1c1c1c;
box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2619;--ink:#e6f4ea;--muted:#8fb09a;--key:#1b3a28;--line:#000}}
:root[data-theme="dark"]{--bg:#0f2619;--ink:#e6f4ea;--muted:#8fb09a;--key:#1b3a28;--line:#000}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{color:#fff;font-family:"Ubuntu","PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,.it:focus-visible{outline:3px solid #ffe65d;outline-offset:2px}
.sh,.chip,.rb,.ov,.eq{text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000}
.tl{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-start;z-index:2;pointer-events:none}
.chip{background:rgba(0,0,0,.4);border:3px solid #1c1c1c;border-radius:10px;padding:3px 12px;font-size:17px}
.hearts{color:#ff6b6b;letter-spacing:2px}
.bl{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:2}
.rb{width:58px;height:44px;background:rgba(0,0,0,.45);border:3px solid #1c1c1c;border-radius:10px;font-size:15px}
.rb:active{background:#ffe65d;color:#111;text-shadow:none}
.eq{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px;background:rgba(0,0,0,.35);border:3px solid #1c1c1c;border-radius:12px;z-index:2;max-width:98vw}
.it{position:relative;width:46px;height:46px;border:3px solid #1c1c1c;border-radius:8px;display:grid;place-items:center;font-size:26px;color:#fff;cursor:pointer;flex:none;
font-family:"STIX Two Text","Times New Roman",serif;text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000}
.eq .it{width:clamp(36px,9.5vw,54px);height:clamp(36px,9.5vw,54px)}
.it.em{background:rgba(0,0,0,.25);border-style:dashed}
.it i{position:absolute;right:2px;bottom:-2px;font-size:13px;font-style:normal}
.it[data-can]{box-shadow:0 0 0 3px #fff,0 0 0 6px #ffe65d}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-120px);background:#ffe65d;color:#111;border:4px solid #1c1c1c;border-radius:8px;padding:6px 14px;transition:transform .3s;pointer-events:none;white-space:nowrap;z-index:9;font-size:16px;text-shadow:none}
#toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:5;padding:12px 12px 190px}
.modal[hidden]{display:none}
.mbox{width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--key);color:var(--ink);border:5px solid #1c1c1c;border-radius:10px;padding:12px;text-shadow:none}
.tabs{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tb{padding:6px 14px;border:3px solid #1c1c1c;border-radius:8px;background:rgba(128,128,128,.18);font-size:16px;color:inherit}
.tb.on{background:#ffe65d;color:#111}
.tb.x{margin-left:auto;background:#ff6b6b;color:#fff}
.tb:disabled{opacity:.45;cursor:not-allowed}
#inv{display:flex;flex-wrap:wrap;gap:6px;min-height:46px}
#inv.al{display:block}
.ar{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:5px 0;border-bottom:2px solid rgba(128,128,128,.25)}
.ar.lk{opacity:.55}
.ar .tb{margin-left:auto;padding:3px 10px;font-size:14px}
.hint{color:var(--muted);font-size:14px;line-height:1.5;display:block}
.tabs+.hint{margin:0 0 8px}
#msg{min-height:20px;font-size:15px;margin:6px 0 0}
.ov{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;background:rgba(10,40,22,.86);padding:16px}
.ov[hidden]{display:none}
.ov h1{margin:0;font-size:clamp(34px,9vw,64px)}
.ov h2{margin:0;font-size:clamp(20px,4.5vw,28px)}
.ov p{margin:0;max-width:34em;font-size:16px;line-height:1.55;opacity:.95}
.go{font-size:24px;padding:8px 34px;background:#7eef6d;color:#12301a;border:4px solid #1c1c1c;border-radius:8px;text-shadow:none}
.go:active{background:#5fd34f}
.ov .tb{color:#111;background:#fff;text-shadow:none}
.row{display:flex;gap:6px}
.row.bk .it{width:clamp(30px,8vw,42px);height:clamp(30px,8vw,42px);font-size:20px}
.it[data-n]::before{content:attr(data-n);position:absolute;top:-2px;left:3px;font-size:11px;opacity:.85;text-shadow:none;color:#fff;mix-blend-mode:difference}
.it[data-sel]{box-shadow:0 0 0 3px #fff,0 0 0 6px #ffe65d}
body.op .eq{z-index:7}
.nm{font:inherit;font-size:20px;padding:8px 12px;border:4px solid #1c1c1c;border-radius:8px;text-align:center;width:min(260px,80vw);background:#fff;color:#111;text-shadow:none;user-select:text;-webkit-user-select:text}
#hp.hpbar{width:190px;height:24px;position:relative;background:rgba(0,0,0,.45);border:3px solid #1c1c1c;border-radius:10px;overflow:hidden}
.hpbar .f{position:absolute;left:0;top:0;bottom:0;background:#7eef6d;transition:width .15s}
.hpbar b{position:relative;display:block;text-align:center;font-size:14px;line-height:18px}
#tip{position:fixed;z-index:12;max-width:270px;background:rgba(14,24,19,.96);color:#fff;border:3px solid #1c1c1c;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.55;pointer-events:none;text-shadow:none;font-weight:700}
#tip[hidden]{display:none}
.dexg{display:flex;flex-wrap:wrap;gap:6px}
.dexg .it{font-size:20px;overflow:hidden}
.hpbar.pz .f{background:#b0d23a}.hpbar.pz{border-color:#4a7a10}
.xpb{display:inline-block;width:90px;height:8px;background:rgba(0,0,0,.5);border-radius:4px;margin-left:8px;vertical-align:middle;overflow:hidden}
.xpb i{display:block;height:100%;background:#ffe65d}
.skg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.sk{border:3px solid #1c1c1c;border-radius:10px;padding:8px;text-align:center;cursor:pointer;background:rgba(128,128,128,.12)}
.sk.cur{border-color:#ffe65d;background:rgba(255,230,93,.25)}
.sk.lk{opacity:.5;cursor:not-allowed}
.sp{width:44px;height:44px;border-radius:50%;border:4px solid;margin:0 auto 6px}
.sk b{display:block}

/* ===== florr 风格界面 ===== */
.mbox{width:min(660px,100%);background:#5d616c;color:#fff;border:6px solid #2d2f36;border-radius:18px;box-shadow:0 8px 0 rgba(0,0,0,.28);text-shadow:-1px -1px 0 rgba(0,0,0,.85),1px -1px 0 rgba(0,0,0,.85),-1px 1px 0 rgba(0,0,0,.85),1px 1px 0 rgba(0,0,0,.85);padding:14px}
.mbox .hint{color:#e3e6ee;font-weight:600}
.tb{background:#7b808c;border:3px solid #2d2f36;border-radius:10px;color:#fff;font-weight:700;box-shadow:0 4px 0 #2d2f36;text-shadow:inherit}
.tb:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #2d2f36}
.tb.on{background:#2fc653;color:#fff}
.tb.x{background:#e0463c;color:#fff}
.ov .tb{color:#111;text-shadow:none}
#inv{background:rgba(0,0,0,.28);border:3px solid rgba(0,0,0,.38);border-radius:14px;padding:10px;gap:8px;min-height:72px}
#msg{color:#ffe65d;font-weight:700}
.it{border-radius:10px;box-shadow:inset 0 -7px 0 rgba(0,0,0,.2),0 3px 0 rgba(0,0,0,.35);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.it[data-s]{cursor:pointer}
.it.em{background:rgba(0,0,0,.3);border:3px solid rgba(0,0,0,.45);box-shadow:inset 0 4px 8px rgba(0,0,0,.4)}
.it.dragging{opacity:.28}
.dgh{position:fixed;z-index:40;pointer-events:none;transform:translate(-50%,-50%) scale(1.18) rotate(-5deg);box-shadow:0 12px 20px rgba(0,0,0,.45);opacity:.96}
.dh{outline:4px solid #fff;outline-offset:2px}
body.dgb #tip{display:none!important}
body.dgb{cursor:grabbing}
.eq{background:rgba(40,42,50,.55);border:4px solid rgba(22,24,30,.8);border-radius:18px;gap:8px;padding:8px 10px}
.eq .it{touch-action:none}
.ar{background:rgba(0,0,0,.24);border:3px solid rgba(0,0,0,.4);border-radius:12px;padding:7px 12px;margin-bottom:7px;align-items:center}
.ar:not(.lk){border-color:#e8c33a}
.tcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.tc{display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,.26);border:3px solid rgba(0,0,0,.42);border-radius:14px;padding:10px}
.tc b{font-size:18px}
.tc .tb{margin-top:auto}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pp{width:13px;height:13px;border-radius:4px;background:rgba(0,0,0,.45);border:2px solid rgba(0,0,0,.55)}
.pp.on{background:#ffe65d;border-color:#9a7f10}
.dexg{gap:8px}
.dexg .it{width:54px;height:54px}
.sk{background:rgba(0,0,0,.24);border-color:rgba(0,0,0,.42);color:#fff}
.sk.cur{border-color:#2fc653;background:rgba(47,198,83,.25)}
#cft{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;background:rgba(0,0,0,.28);border:3px solid rgba(0,0,0,.38);border-radius:14px;padding:12px;margin-bottom:10px}
#cft[hidden]{display:none}
.ring{position:relative;width:200px;height:200px;flex:none;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.25) 0 62%,transparent 63%)}
.ring .it{position:absolute;margin:-23px 0 0 -23px;cursor:default}
.ctr{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:4px solid #2d2f36;background:#4a4e59;display:grid;place-items:center;font-size:15px;font-weight:700}
.cinfo{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cinfo b{font-size:19px}
.go2{padding:8px 26px;border-radius:12px;border:3px solid #1b6e30;background:#2fc653;color:#fff;font-size:20px;font-weight:700;box-shadow:0 5px 0 #1b6e30;text-shadow:inherit;margin-top:4px}
.go2:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #1b6e30}
.go2:disabled{background:#7b808c;border-color:#454953;box-shadow:0 5px 0 #454953;opacity:.75}

/* ===== florr 合成动画 + 底部装备栏 ===== */
.rot{position:absolute;inset:0}
@keyframes rspin{0%{transform:rotate(0) scale(1)}65%{transform:rotate(760deg) scale(1)}100%{transform:rotate(1300deg) scale(.12)}}
@keyframes runspin{0%{transform:rotate(0)}65%{transform:rotate(-760deg)}100%{transform:rotate(-1300deg)}}
@keyframes cpulse{from{box-shadow:0 0 0 0 rgba(255,230,93,.0)}to{box-shadow:0 0 22px 6px rgba(255,230,93,.85)}}
@keyframes cpop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes cshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ring.spin .rot{animation:rspin 2.3s cubic-bezier(.5,0,.85,.7) forwards}
.ring.spin .rot .it{animation:runspin 2.3s cubic-bezier(.5,0,.85,.7) forwards}
.ctr.busy{animation:cpulse .45s infinite alternate;background:#6a5a1a}
.ctr.win{animation:cpop .5s;background:rgba(0,0,0,.2);border-color:#2fc653}
.ctr.lose{animation:cshake .5s;background:#6b2b2b;border-color:#c0392b;font-size:28px}
.ring .ctr .it{position:static;margin:0;width:48px;height:48px;cursor:default}
.it[data-s]::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(rgba(255,255,255,.24),rgba(255,255,255,0) 55%);pointer-events:none}
.it[data-n]::before{color:#fff;mix-blend-mode:normal;font-weight:700;font-size:12px;top:1px;left:4px;opacity:1;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;z-index:2}
.eq{background:none!important;border:0!important;box-shadow:none!important;padding:0;gap:6px}
.eq .row{gap:6px}
.eq .it{width:clamp(42px,11vw,62px);height:clamp(42px,11vw,62px);border-width:4px;border-radius:13px;font-size:30px;transition:transform .08s}
.eq .it:hover{transform:translateY(-3px)}
.eq .row.bk{gap:5px}
.eq .row.bk .it{width:clamp(32px,8.5vw,46px);height:clamp(32px,8.5vw,46px);border-width:3px;border-radius:10px;font-size:22px;opacity:.93}
.eq .it.em{background:rgba(0,0,0,.3);border-color:rgba(0,0,0,.42);border-style:solid;box-shadow:inset 0 3px 7px rgba(0,0,0,.38)}

/* ===== florr 风格主页 ===== */
body.home .tl,body.home .bl,body.home .eq{display:none}
.ov.home{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 0 38%,rgba(0,0,0,.5) 100%);gap:10px}
.ov:not(.home) .logo,.ov:not(.home) .tag,.ov:not(.home) .help,.ov:not(.home) .help2{display:none}
.ov.home #ot,.ov.home #od{display:none}
.logo{display:flex;gap:.03em;font-size:clamp(64px,20vw,140px);line-height:1.05;margin-bottom:-2px}
.logo span{display:inline-block;animation:bob 2.6s ease-in-out infinite;text-shadow:.06em 0 #1c1c1c,-.06em 0 #1c1c1c,0 .06em #1c1c1c,0 -.06em #1c1c1c,.045em .045em #1c1c1c,-.045em .045em #1c1c1c,.045em -.045em #1c1c1c,-.045em -.045em #1c1c1c,0 .11em 0 rgba(0,0,0,.35)}
.logo span:nth-child(1){color:#ffe763}.logo span:nth-child(2){color:#7eef6d;animation-delay:.25s}.logo span:nth-child(3){color:#6db8ff;animation-delay:.5s}.logo span:nth-child(4){color:#ff6b6b;animation-delay:.75s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-.08em) rotate(3deg)}}
.tag{font-size:clamp(16px,4vw,22px);margin-bottom:6px}
.hbox{display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(0,0,0,.3);border:4px solid #1c1c1c;border-radius:18px;padding:16px 24px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.ov.home .go{font-size:26px;padding:10px 48px;background:#2fc653;color:#fff;border:4px solid #1b6e30;border-radius:14px;box-shadow:0 6px 0 #1b6e30;text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000}
.ov.home .go:active{transform:translateY(5px);box-shadow:0 1px 0 #1b6e30}
.svi{font-size:15px;min-height:1.2em}
.help{font-size:14px;line-height:1.75;background:rgba(0,0,0,.28);border:3px solid rgba(0,0,0,.42);border-radius:12px;padding:8px 16px;max-width:min(580px,92vw)}
.help2{font-size:14px;max-width:min(520px,90vw);opacity:.95;line-height:1.6}

/* ===== florr 风格死亡界面 ===== */
.ov.dead{background:radial-gradient(ellipse at center,rgba(70,0,0,.5),rgba(18,0,0,.88));animation:dfade .7s}
@keyframes dfade{from{opacity:0}to{opacity:1}}
.ov.dead #ot{font-size:clamp(46px,13vw,88px);color:#ff5a4a;text-shadow:.05em 0 #1c1c1c,-.05em 0 #1c1c1c,0 .05em #1c1c1c,0 -.05em #1c1c1c,.04em .04em #1c1c1c,-.04em .04em #1c1c1c,.04em -.04em #1c1c1c,-.04em -.04em #1c1c1c}
.ov.dead #od{font-size:clamp(17px,4.2vw,25px);max-width:34em;line-height:1.5}
.ov.dead .hbox{background:none;border:0;box-shadow:none;padding:0}
.ov.dead .nm,.ov.dead .svi{display:none}
.ov.dead .go{font-size:26px;padding:10px 48px;background:#2fc653;color:#fff;border:4px solid #1b6e30;border-radius:14px;box-shadow:0 6px 0 #1b6e30;text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000}
.ov.dead .go:active{transform:translateY(5px);box-shadow:0 1px 0 #1b6e30}
#pzv{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;box-shadow:inset 0 0 70px 26px rgba(170,60,230,.8),inset 0 0 200px 70px rgba(110,20,170,.5);transition:opacity .12s}

/* ===== florr 风格左侧栏 ===== */
.tl{gap:7px}
#lv.chip{background:none;border:0;padding:0;font-size:20px;font-weight:700;letter-spacing:.5px}
#plc.chip{background:none;border:0;padding:0}
.xpw{position:relative;width:230px;height:26px;background:#2f323a;border:4px solid #1c1c1c;border-radius:14px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.xpw i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe978,#efb91a);transition:width .2s}
.xpw b{position:relative;display:block;text-align:center;font-size:15px;line-height:18px}
#hp.hpbar{width:230px;height:28px;background:#2f323a;border:4px solid #1c1c1c;border-radius:15px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.hpbar .f{background:linear-gradient(#a8f78d,#4fcf46)}
.hpbar b{line-height:20px;font-size:15px}
.hpbar.pz .f{background:linear-gradient(#d4ee6e,#97c82a)}
.bl{gap:8px;flex-wrap:wrap;max-height:86vh;align-content:flex-start}
.rb{position:relative;width:60px;height:60px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--c,#888);border:4px solid #1c1c1c;border-radius:14px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),0 4px 0 rgba(0,0,0,.4);color:#fff;font-weight:700;cursor:pointer;transition:transform .08s}
.rb i{font-style:normal;font-size:24px;line-height:1.05;text-shadow:none}
.rb span{font-size:12px;line-height:1.1}
.rb::after{content:'';position:absolute;inset:0;border-radius:10px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0) 52%);pointer-events:none}
.rb[data-k]::before{content:attr(data-k);position:absolute;left:4px;top:0;font-size:11px;opacity:.95}
.rb:hover{transform:translateX(4px)}
.rb:active{background:var(--c,#888);color:#fff;text-shadow:inherit;transform:translateY(3px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),0 1px 0 rgba(0,0,0,.4)}
.rb.dot i::after{content:'';position:absolute;right:3px;top:3px;width:13px;height:13px;border-radius:50%;background:#ff3b30;border:3px solid #1c1c1c}
@media (max-height:700px){.rb{width:50px;height:50px;border-radius:12px}.rb i{font-size:20px}.rb span{font-size:11px}.xpw{width:200px}#hp.hpbar{width:200px}}
</style></head>
<body>

  if(!ok(sx,sy)||!ok(gx,gy))return null;

  const push=(id,f)=>{let i=ha.length;ha.push(id);hf.push(f);while(i>0){const p=(i-1)>>1;if(hf[p]<=f)break;ha[i]=ha[p];hf[i]=hf[p];i=p}ha[i]=id;hf[i]=f};
  const pop=()=>{const id=ha[0],last=ha.pop(),lf=hf.pop();if(ha.length){let i=0;const m=ha.length;for(;;){let c=i*2+1;if(c>=m)break;if(c+1<m&&hf[c+1]<hf[c])c++;if(hf[c]>=lf)break;ha[i]=ha[c];hf[i]=hf[c];i=c}ha[i]=last;hf[i]=lf}return id};

  A.st[s0]=ver;A.g[s0]=0;A.pa[s0]=-1;A.cl[s0]=0;push(s0,hh(sx,sy));
  let exp=0,found=false;
  while(ha.length&&exp<2600){
    const u=pop();if(A.st[u]===ver&&A.cl[u]===2)continue;
    A.cl[u]=2;exp++;if(u===g0){found=true;break}
    const ux=u%COLS,uy=(u/COLS)|0;
    for(const[a,b,c]of AD){const x=ux+a,y=uy+b;if(!ok(x,y))continue;if(a&&b&&(!ok(ux+a,uy)||!ok(ux,uy+b)))continue;
      const v=y*COLS+x;if(A.st[v]===ver&&A.cl[v]===2)continue;
      const pen=(!ok(x+1,y)||!ok(x-1,y)||!ok(x,y+1)||!ok(x,y-1))?.6:0,ng=A.g[u]+c+pen;
      if(A.st[v]!==ver||ng<A.g[v]){A.st[v]=ver;A.g[v]=ng;A.pa[v]=u;A.cl[v]=1;push(v,ng+hh(x,y))}}
  }

  const out=[];for(let u=g0;u>=0;u=A.pa[u]){out.push([((u%COLS)+.5)*C,(((u/COLS)|0)+.5)*C]);if(u===s0)break}
  return out.reverse()
}
function chase(m,dx,dy,d,dt){
  const r=CR(m.r),px=pr.x,py=pr.y;
  if(m.nd>0){m.nd-=dt;const cx=(Math.floor(m.x/C)+.5)*C,cy=(Math.floor(m.y/C)+.5)*C,l=Math.hypot(cx-m.x,cy-m.y);if(l>6)return[(cx-m.x)/l,(cy-m.y)/l]}
  if(d<420&&los(m.x,m.y,px,py,r)){m.path=null;m.rp=0;return[dx/d,dy/d]}
  // stuck detection: no progress for 0.6s while chasing -> replan
  m.stk=(m.stk||0)+dt;if(m.stk>.6){if(m.lx!==undefined&&Math.hypot(m.x-m.lx,m.y-m.ly)<5&&!(m.stun>0)&&!(m.frz>0)){m.path=null;m.rp=0;m.nd=.5}m.lx=m.x;m.ly=m.y;m.stk=0}
  m.rp=(m.rp||0)-dt;
  const gx=cl(Math.floor(px/C),0,COLS-1),gy=cl(Math.floor(py/C),0,ROWS-1);
  if(m.path&&m.pg&&(Math.abs(m.pg[0]-gx)>2||Math.abs(m.pg[1]-gy)>2))m.rp=Math.min(m.rp,0);
  if((!m.path||m.rp<=0)&&APB>0){
    APB--;const sx=cl(Math.floor(m.x/C),0,COLS-1),sy=cl(Math.floor(m.y/C),0,ROWS-1);
    const p=astar(sx,sy,gx,gy);m.rp=.6+Math.random()*.5;m.pg=[gx,gy];
    if(p&&p.length){m.path=p;m.pi=p.length>1?1:0}else m.path=null}
  const P=m.path;
  if(P&&P.length){
    let i=Math.min(m.pi||0,P.length-1);
    while(i<P.length-1&&Math.hypot(P[i][0]-m.x,P[i][1]-m.y)<C*.4)i++;
    for(let k=Math.min(i+3,P.length-1);k>i;k--)if(los(m.x,m.y,P[k][0],P[k][1],r)){i=k;break}
    m.pi=i;const tx=P[i][0]-m.x,ty=P[i][1]-m.y,l=Math.hypot(tx,ty);
    if(l<4&&i>=P.length-1){m.path=null;return[dx/d,dy/d]}
    return[tx/(l||1),ty/(l||1)]}
  const g=dir(m);return g
}
